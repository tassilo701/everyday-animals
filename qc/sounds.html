<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sound check — Everyday Animals</title>
  <style>
    :root { --bg: #fbf6ee; --card: #fff; --ink: #26231f; --ink2: #6f685e; --bad: #e5484d; --ok: #2f6f6a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 ui-rounded, system-ui, sans-serif; }
    header { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 14px 16px 10px; border-bottom: 1px solid #0001; }
    h1 { margin: 0; font-size: 20px; }
    p { margin: 4px 0 0; color: var(--ink2); }
    .bar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
    button { font: inherit; border: 0; border-radius: 99px; padding: 8px 14px; background: var(--ink); color: #fff; cursor: pointer; }
    button.ghost { background: #0000000d; color: var(--ink); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; padding: 12px 16px 80px; }
    .a { background: var(--card); border-radius: 16px; overflow: hidden; box-shadow: 0 1px 3px #0002; position: relative; }
    .a img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; cursor: pointer; }
    .a .row { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; gap: 6px; }
    .a b { font-size: 14px; }
    .a small { display: block; color: var(--ink2); font-size: 11px; }
    .a label { font-size: 12px; color: var(--bad); display: flex; gap: 4px; align-items: center; white-space: nowrap; }
    .a.bad { outline: 3px solid var(--bad); }
    .a.playing { outline: 3px solid var(--ok); }
    .play { position: absolute; top: 8px; left: 8px; width: 40px; height: 40px; border-radius: 50%; background: #fffe; display: grid; place-items: center; pointer-events: none; font-size: 16px; }
    textarea { width: 100%; min-height: 60px; margin-top: 8px; font: 13px ui-monospace, monospace; border-radius: 10px; border: 1px solid #0002; padding: 8px; display: none; }
  </style>
</head>
<body>
<header>
  <h1>Sound check</h1>
  <p>Tap a photo to hear the call. Tick “swap” if it sounds wrong (wrong animal, mostly noise, people talking). Your ticks are saved on this device.</p>
  <div class="bar">
    <button id="all">▶ Play all in a row</button>
    <button class="ghost" id="stop">Stop</button>
    <button class="ghost" id="copy">Copy my “swap” list</button>
    <span id="count"></span>
  </div>
  <textarea id="out" readonly></textarea>
</header>
<div class="grid" id="grid"></div>
<script>
  const base = location.pathname.replace(/qc\/sounds\.html$/, '');
  const KEY = 'ea.soundcheck.v1';
  const bad = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));
  const audio = new Audio();
  let queue = [], current = null;
  const save = () => { localStorage.setItem(KEY, JSON.stringify([...bad])); document.getElementById('count').textContent = bad.size ? `${bad.size} to swap` : ''; };
  const mark = (id, on) => document.querySelectorAll('.a').forEach((el) => el.dataset.id === id && el.classList.toggle('playing', on));
  function play(s) {
    if (current) mark(current, false);
    current = s.id; mark(s.id, true);
    audio.src = base + s.sound.f; audio.currentTime = 0; audio.play();
    document.querySelector(`.a[data-id="${s.id}"]`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  audio.addEventListener('ended', () => { if (current) mark(current, false); const n = queue.shift(); if (n) setTimeout(() => play(n), 500); });
  fetch(base + 'data/species.json').then((r) => r.json()).then((species) => {
    const list = species.filter((s) => s.sound);
    const grid = document.getElementById('grid');
    for (const s of list) {
      const el = document.createElement('div');
      el.className = 'a' + (bad.has(s.id) ? ' bad' : '');
      el.dataset.id = s.id;
      el.innerHTML = `<img src="${base + s.thumb}" alt=""><span class="play">▶</span><div class="row"><div><b>${s.en}</b><small>“${s.says ?? ''}”</small></div><label><input type="checkbox" ${bad.has(s.id) ? 'checked' : ''}> swap</label></div>`;
      el.querySelector('img').onclick = () => { queue = []; play(s); };
      el.querySelector('input').onchange = (e) => { e.target.checked ? bad.add(s.id) : bad.delete(s.id); el.classList.toggle('bad', e.target.checked); save(); };
      grid.appendChild(el);
    }
    document.getElementById('all').onclick = () => { queue = list.slice(1); play(list[0]); };
    document.getElementById('stop').onclick = () => { queue = []; audio.pause(); if (current) mark(current, false); };
    document.getElementById('copy').onclick = async () => {
      const text = [...bad].join(' ');
      const out = document.getElementById('out');
      out.style.display = 'block'; out.value = text || '(nothing ticked)'; out.select();
      try { await navigator.clipboard.writeText(text); } catch {}
    };
    save();
  });
</script>
</body>
</html>
